  function showActionToast(text, kind = 'ok', reason = '', duration = 3500) {
    const el = document.getElementById('actionToast'); if (!el) return;
    clearTimeout(actionToastTimer);
    el.textContent = text; el.className = `visible ${kind}`; el.dataset.reason = reason;
    actionToastTimer = setTimeout(hideActionToast, duration);
    requestAnimationFrame(reportSize);
  }

  function clearWatchlistFullToast() {
    const el = document.getElementById('actionToast');
    if (watchlist.length < WATCHLIST_MAX && el?.dataset.reason === 'watch-full') hideActionToast();
  }

  function maybeAutoAddWatch(item) {
    const clean = sanitizeSymbolItem(item); if (!clean) return false;
    const existing = watchlist.find(v => v.symbol === clean.symbol);
    if (existing) {
      if (clean.name && existing.name !== clean.name) existing.name = clean.name;
      removeRecentSymbol(clean.symbol); saveWatchlist(); renderSymbolControls(); return true;
    }
    if (watchlist.length >= WATCHLIST_MAX) {
      showActionToast('自选已满 8 个，本次仅查看', 'warn', 'watch-full');
      return false;
    }
    watchlist.push(clean); removeRecentSymbol(clean.symbol); saveWatchlist(); renderSymbolControls();
    showActionToast(`已加入自选 ${watchlist.length} / ${WATCHLIST_MAX}`, 'ok', 'watch-add');
    return true;
  }

  function removeWatchItem(symbol) {
    const index = watchlist.findIndex(v => v.symbol === symbol); if (index < 0) return;
    const [item] = watchlist.splice(index, 1); saveWatchlist();
    clearWatchlistFullToast();
    if (currentSymbol === symbol) addRecentSymbol(item);
    renderSymbolControls();
    lastDeletedWatch = { item, index, expiresAt: Date.now() + 5000 };
    const toast = document.getElementById('undoToast'); const text = document.getElementById('undoText');
    if (text) text.textContent = `已移除 ${item.name}`;
    if (toast) toast.classList.add('visible');
    clearTimeout(undoTimer); undoTimer = setTimeout(() => { lastDeletedWatch = null; if (toast) toast.classList.remove('visible'); }, 5000);
    requestAnimationFrame(reportSize);
  }

  function undoDeleteWatch() {
    if (!lastDeletedWatch || Date.now() > lastDeletedWatch.expiresAt || watchlist.length >= WATCHLIST_MAX) return;
    if (!watchlist.some(v => v.symbol === lastDeletedWatch.item.symbol)) {
      watchlist.splice(Math.min(lastDeletedWatch.index, watchlist.length), 0, lastDeletedWatch.item);
      removeRecentSymbol(lastDeletedWatch.item.symbol);
      saveWatchlist(); renderSymbolControls();
    }
    lastDeletedWatch = null; clearTimeout(undoTimer);
    document.getElementById('undoToast')?.classList.remove('visible');
    requestAnimationFrame(reportSize);
  }

  function moveWatchItem(fromSymbol, toSymbol) {
    if (!fromSymbol || !toSymbol || fromSymbol === toSymbol) return;
    const from = watchlist.findIndex(v => v.symbol === fromSymbol), to = watchlist.findIndex(v => v.symbol === toSymbol);
    if (from < 0 || to < 0) return;
    const [item] = watchlist.splice(from, 1); watchlist.splice(to, 0, item);
    saveWatchlist(); renderSymbolControls();
  }

  function toggleTickerWatchMenu(force) {
    const menu = document.getElementById('tickerWatchMenu'); const trigger = document.getElementById('tickerSymbolTrigger');
    if (!menu || !trigger) return;
    if (trigger.disabled && force !== false) return;
    const show = typeof force === 'boolean' ? force : !menu.classList.contains('visible');
    if (show) toggleSymbolMenu(false);
    menu.classList.toggle('visible', show); menu.setAttribute('aria-hidden', show ? 'false' : 'true'); trigger.setAttribute('aria-expanded', show ? 'true' : 'false');
    requestAnimationFrame(reportSize);
  }

  function toggleSymbolMenu(force) {
    const menu = document.getElementById('symbolMenu'); const trigger = document.getElementById('symbolTrigger');
    if (!menu || !trigger) return;
    const show = typeof force === 'boolean' ? force : !menu.classList.contains('visible');
    if (show) toggleTickerWatchMenu(false);
    menu.classList.toggle('visible', show); menu.setAttribute('aria-hidden', show ? 'false' : 'true'); trigger.setAttribute('aria-expanded', show ? 'true' : 'false');
    requestAnimationFrame(reportSize);
  }

  function setSearchStatus(text = '', kind = '') {
    const el = document.getElementById('searchStatus'); if (!el) return;
    el.textContent = text; el.className = kind;
  }

  function renderSearchResults(results) {
    currentSearchResults = Array.isArray(results) ? results : [];
    const box = document.getElementById('searchResults'); if (!box) return;
    box.innerHTML = '';
    for (const item of currentSearchResults) {
      const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'search-result';
      btn.innerHTML = `<span></span><code></code>`; btn.querySelector('span').textContent = item.name || item.symbol; btn.querySelector('code').textContent = item.symbol;
      btn.onclick = () => chooseSearchResult(item);
      box.appendChild(btn);
    }
    box.classList.toggle('visible', currentSearchResults.length > 0);
    requestAnimationFrame(reportSize);
  }

  async function performSearch(raw) {
    const q = String(raw || '').trim(); const seq = ++searchSeq;
    if (!q) { renderSearchResults([]); setSearchStatus(''); return []; }
    hideActionToast();
    setSearchStatus('搜索中…');
    if (window.__inElectron && typeof require !== 'undefined') {
      try {
        const res = await require('electron').ipcRenderer.invoke('search-symbols', q);
        if (seq !== searchSeq) return [];
        const results = Array.isArray(res?.results) ? res.results : [];
        renderSearchResults(results);
        if (res?.error) setSearchStatus('搜索服务暂时不可用，请检查网络', 'error');
        else setSearchStatus(results.length ? `${results.length} 个匹配` : '没有找到匹配标的', results.length ? '' : 'warn');
        return results;
      } catch (e) {
        if (seq !== searchSeq) return [];
        setSearchStatus('搜索服务暂时不可用', 'error'); renderSearchResults([]); return [];
      }
    }
    const sym = normalizeSymbol(q);
    const results = sym ? [{ symbol: sym, name: sym }] : [];
    renderSearchResults(results);
    setSearchStatus(results.length ? '浏览器预览：代码可查；中文搜索请用安装版' : '浏览器预览仅支持代码', results.length ? '' : 'warn');
    return results;
  }

  function chooseSearchResult(item) {
    const clean = sanitizeSymbolItem(item); if (!clean) return;
    selectSymbol(clean.symbol, { name: clean.name });
    const inWatch = maybeAutoAddWatch(clean);
    if (!inWatch && !watchlist.some(v => v.symbol === clean.symbol)) addRecentSymbol(clean);
    document.getElementById('customSymbol').value = '';
    renderSearchResults([]); setSearchStatus(''); toggleSymbolMenu(false); toggleTickerWatchMenu(false);
  }

  function quoteSourceMs(meta = lastQuoteMeta) {
    if (!meta.quoteDate || !meta.quoteTime) return 0;
    const t = Date.parse(`${meta.quoteDate}T${meta.quoteTime}+08:00`);
    return Number.isFinite(t) ? t : 0;
  }

  function formatClockTime(value) {
    const d = new Date(value); if (!Number.isFinite(d.getTime())) return '--';
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
  }

  function currentQuoteAgeSeconds() {
    const ms = quoteSourceMs(); return ms ? Math.max(0, Math.round((Date.now() - ms) / 1000)) : null;
  }

  function realTradingNow() { return getWorkBuddyPhaseAt(new Date()) === 'trading'; }

  function refreshFeedFreshness() {
    if (simMode) {
      lastFreshnessClass = 'sim';
      feedStatusDot.className = 'sim';
      document.getElementById('ticker').classList.remove('feed-offline','feed-reconnecting');
      renderDiagnostics(); return;
    }
    const tickerEl = document.getElementById('ticker');
    const state = lastFeedStatus.state || 'online'; const age = currentQuoteAgeSeconds();
    let cls = 'idle', label = lastQuoteMeta.quoteTime ? lastQuoteMeta.quoteTime.slice(0,5) : '--:--';
    if (state === 'offline') { cls = 'offline'; label = lastQuoteMeta.quoteTime ? `断·${lastQuoteMeta.quoteTime.slice(0,5)}` : '中断'; }
    else if (state === 'reconnecting') { cls = 'reconnecting'; label = lastQuoteMeta.quoteTime ? `连·${lastQuoteMeta.quoteTime.slice(0,5)}` : '重连'; }
    else if (realTradingNow() && age !== null && age > 20) { cls = 'offline'; label = lastQuoteMeta.quoteTime ? `旧·${lastQuoteMeta.quoteTime.slice(0,5)}` : '稍旧'; }
    else if (realTradingNow() && age !== null && age > 10) { cls = 'aging'; }
    else if (realTradingNow()) { cls = 'fresh'; }
    else { cls = 'idle'; }
    const previousClass = lastFreshnessClass;
    lastFreshnessClass = cls;
    feedStatusDot.className = cls; feedTime.textContent = label;
    tickerEl.classList.toggle('feed-offline', cls === 'offline');
    tickerEl.classList.toggle('feed-reconnecting', cls === 'reconnecting');
    const ageText = age === null ? '未知' : `${age}s`;
    idxBadge.title = `${cls === 'offline' ? FEED_OFFLINE_LABEL : '行情 ' + cls} · 源 ${lastQuoteMeta.quoteDate || '--'} ${lastQuoteMeta.quoteTime || '--'} · 年龄 ${ageText}`;
    if (currentPhase === 'trading' && cls === 'offline' && previousClass !== 'offline') {
      setTheme('rest'); setState('failed'); setSlogan(state === 'offline' ? '行情断线了' : '行情有点旧', '#ff9f0a', 'breathe');
    } else if (currentPhase === 'trading' && previousClass === 'offline' && (cls === 'fresh' || cls === 'aging')) {
      setSlogan('行情恢复啦', '#30d158', 'bounce'); playState('waving', () => resumeTrading());
    }
    renderDiagnostics();
  }

  function renderDiagnostics() {
    const age = currentQuoteAgeSeconds();
    const set = (id, value) => { const el = document.getElementById(id); if (el) el.textContent = value; };
    set('diagSymbol', currentSymbol || '--');
    set('diagQuoteTime', lastQuoteMeta.quoteDate && lastQuoteMeta.quoteTime ? `${lastQuoteMeta.quoteDate} ${lastQuoteMeta.quoteTime}` : '--');
    set('diagReceived', lastQuoteMeta.receivedAt ? formatClockTime(lastQuoteMeta.receivedAt) : '--');
    set('diagAge', age === null ? '--' : `${age} 秒`);
    set('diagRequest', `${Number(lastFeedStatus.requestMs || lastQuoteMeta.requestMs || 0)} ms`);
    set('diagFailures', String(lastFeedStatus.consecutiveFailures || 0));
    set('diagRefresh', lastFeedStatus.nextRefreshMs ? `${Math.round(lastFeedStatus.nextRefreshMs / 1000)} 秒` : '--');
    set('diagTransport', lastFeedStatus.transport || lastQuoteMeta.transport || '--');
  }

  function buildDiagnosticsText() {
    const age = currentQuoteAgeSeconds();
    return [
      '牛来看盘神器 · 行情诊断',
      `当前标的: ${currentSymbol || '--'}`,
      '行情源: 新浪',
      `状态: ${lastFeedStatus.state || '--'}`,
      `源行情时间: ${lastQuoteMeta.quoteDate || '--'} ${lastQuoteMeta.quoteTime || '--'}`,
      `最后接收: ${lastQuoteMeta.receivedAt || '--'}`,
      `数据年龄: ${age === null ? '--' : age + ' 秒'}`,
      `请求耗时: ${Number(lastFeedStatus.requestMs || lastQuoteMeta.requestMs || 0)} ms`,
      `连续失败: ${lastFeedStatus.consecutiveFailures || 0}`,
      `刷新周期: ${lastFeedStatus.nextRefreshMs ? Math.round(lastFeedStatus.nextRefreshMs / 1000) + ' 秒' : '--'}`,
      `连接方式: ${lastFeedStatus.transport || lastQuoteMeta.transport || '--'}`,
      `错误: ${lastFeedStatus.error || '--'}`,
    ].join('\n');
  }

  // real-data injection from Electron main process
  window.__pushMarket = (data) => {
    simMode = false;
    if (simBtn) simBtn.classList.remove('active');
    if (realBtn) realBtn.classList.add('active');
    window.lastMarketName = data.name;
    lastQuoteMeta = { quoteDate: data.quoteDate || '', quoteTime: data.quoteTime || '', receivedAt: data.receivedAt || new Date().toISOString(), requestMs: Number(data.requestMs) || 0, transport: data.transport || '' };
    updateSymbolLabel(data.symbol || currentSymbol, data.name);
    lastPrice = data.price; lastPrevClose = data.prevClose;
    evaluatePhase();
    if (!restMode) applyMarket(data.price, data.prevClose, '真实');
    refreshFeedFreshness();
  };

  window.__pushFeedStatus = (status) => {
    const prev = previousFeedState;
    lastFeedStatus = { ...lastFeedStatus, ...(status || {}) };
    previousFeedState = lastFeedStatus.state || prev;
    refreshFeedFreshness();
  };

  window.__onSystemResume = () => { currentPhase = null; evaluatePhase(); refreshFeedFreshness(); };
  window.__setSimulated = (val) => { simMode = val; if (simBtn) simBtn.classList.toggle('active', val); if (realBtn) realBtn.classList.toggle('active', !val); refreshFeedFreshness(); };

  // ---- Web 模式（无 Electron）：经本地代理 /api/quote 拉真实行情 ----
  let webFeedFailures = 0;
  function webFeedDelay() {
    if (webFeedFailures) return [5000,10000,20000,30000][Math.min(webFeedFailures-1,3)];
    const phase = getWorkBuddyPhaseAt(new Date());
    if (phase === 'trading') return 5000;
    if (phase === 'preopen' || phase === 'afternoon') return 10000;
    if (phase === 'lunch') return 30000;
    if (phase === 'review' || phase === 'close') return 60000;
    return 180000;
  }
  async function fetchReal(symbol) {
    const started = Date.now();
    try {
      const r = await fetch('/api/quote?symbol=' + encodeURIComponent(symbol));
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      webFeedFailures = 0;
      window.lastMarketName = d.name;
      lastQuoteMeta = { quoteDate: d.quoteDate || '', quoteTime: d.quoteTime || '', receivedAt: new Date().toISOString(), requestMs: Date.now()-started, transport: 'web-proxy' };
      updateSymbolLabel(d.symbol || currentSymbol, d.name);
      lastPrice = d.price; lastPrevClose = d.prevClose;
      lastFeedStatus = { state:'online', consecutiveFailures:0, nextRefreshMs:webFeedDelay(), requestMs:Date.now()-started, transport:'web-proxy' };
      evaluatePhase(); if (!restMode) applyMarket(d.price, d.prevClose, '真实'); refreshFeedFreshness();
    } catch (e) {
      webFeedFailures += 1;
      lastFeedStatus = { ...lastFeedStatus, state:webFeedFailures>=3?'offline':'reconnecting', consecutiveFailures:webFeedFailures, nextRefreshMs:webFeedDelay(), requestMs:Date.now()-started, error:e.message };
      refreshFeedFreshness();
    }
  }
  function scheduleWebFeed(delay) {
    if (webFeedTimer) clearTimeout(webFeedTimer);
    webFeedTimer = setTimeout(async () => { await fetchReal(currentSymbol); scheduleWebFeed(webFeedDelay()); }, delay);
  }
  function startWebFeed() {
    simMode = false; webFeedFailures = 0;
    if (simBtn) simBtn.classList.remove('active'); if (realBtn) realBtn.classList.add('active');
    if (webFeedTimer) clearTimeout(webFeedTimer);
    fetchReal(currentSymbol).finally(() => scheduleWebFeed(webFeedDelay()));
  }
  function stopWebFeed() { if (webFeedTimer) { clearTimeout(webFeedTimer); webFeedTimer = null; } }

  let lastStep = 0;
  function loop(now) {
    if (!lastFrameTime) lastFrameTime = now;
    if (now - lastFrameTime >= 16) {
      advancePlayback(now - lastFrameTime);
      lastFrameTime = now;
      draw();
    }
    if (simMode && !restMode && now - lastStep > 2000) { stepSimulation(); lastStep = now; }
    requestAnimationFrame(loop);
  }

  // UI hooks
  const simBtn = document.getElementById('simBtn');
  const realBtn = document.getElementById('realBtn');
  const quietModeToggle = document.getElementById('quietModeToggle');
  if (simBtn) simBtn.onclick = () => { stopWebFeed(); window.__setSimulated(true); manualRest = false; evaluatePhase(); };
  if (realBtn) realBtn.onclick = () => {
    if (window.__inElectron) { window.__setSimulated(false); manualRest = false; evaluatePhase(); }
    else { startWebFeed(); manualRest = false; evaluatePhase(); }
  };
  const restBtn = document.getElementById('restBtn');
  if (restBtn) restBtn.onclick = () => { manualRest = !manualRest; evaluatePhase(); };
  if (quietModeToggle) quietModeToggle.onchange = () => {
    applyLowProfileMode(quietModeToggle.checked);
    saveLowProfileMode();
  };

  // 归一化股票代码：支持 sh600519 / 600519 / 600519.SH / 600519 sh 等常见写法
  function normalizeSymbol(raw) {
    if (!raw) return null;
    let s = String(raw).trim();
    s = s.toLowerCase().replace(/\s+/g, '').replace(/\./g, '');
    const suffixMatch = s.match(/^(\d{6})(sh|sz)$/);
    if (suffixMatch) return suffixMatch[2] + suffixMatch[1];
    if (/^(sh|sz)\d{6}$/.test(s)) return s;
    if (/^\d{6}$/.test(s)) return (s[0] === '6' ? 'sh' : 'sz') + s;
    return null;
  }

  // 更新已保存标的名称（名称来自行情返回），默认六项即使删空也不会被重新塞回来。
  function updateSymbolLabel(sym, name) {
    sym = normalizeSymbol(sym); if (!sym || !name) return;
    let changed = false;
    for (const list of [watchlist, recentSymbols]) {
      const item = list.find(v => v.symbol === sym);
      if (item && item.name !== name) { item.name = name; changed = true; }
    }
    if (changed) { saveWatchlist(); saveRecent(); renderSymbolControls(); }
    if (currentSymbol === sym) { window.lastMarketName = name; renderCurrentSymbol(); }
  }

  // 切换标的：同步自选 UI，推送 Electron 主进程或浏览器代理拉取真实行情。
  function selectSymbol(sym, opts = {}) {
    sym = normalizeSymbol(sym); if (!sym) return;
    currentSymbol = sym; saveCurrentSymbol();
    if (opts.name) updateSymbolLabel(sym, opts.name);
    renderSymbolControls();
    if (window.__inElectron && typeof require !== 'undefined') {
      require('electron').ipcRenderer.send('set-symbol', sym); window.__setSimulated(false);
    } else if (!simMode) {
      stopWebFeed(); startWebFeed();
    }
  }

  const customInput = document.getElementById('customSymbol');
  const addBtn = document.getElementById('addSymbol');
  async function queryCustom() {
    const raw = customInput.value.trim(); if (!raw) return;
    let results = currentSearchResults;
    if (!results.length || !results.some(r => r.name.includes(raw) || r.symbol.includes(raw.toLowerCase()))) results = await performSearch(raw);
    if (results.length) chooseSearchResult(results[0]);
    else {
      const sym = normalizeSymbol(raw);
      if (sym) chooseSearchResult({ symbol: sym, name: sym });
    }
  }
  addBtn.onclick = queryCustom;
  customInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); queryCustom(); } });
  customInput.addEventListener('input', () => { clearTimeout(searchTimer); const q = customInput.value.trim(); searchTimer = setTimeout(() => performSearch(q), 260); });
  customInput.addEventListener('focus', () => { toggleSymbolMenu(false); toggleTickerWatchMenu(false); });
  document.getElementById('symbolTrigger').addEventListener('click', () => { document.getElementById('marketDiag').classList.remove('visible'); renderSearchResults([]); toggleSymbolMenu(); });
  document.getElementById('tickerSymbolTrigger').addEventListener('click', e => { e.stopPropagation(); renderTickerWatchlist(); toggleTickerWatchMenu(); });
  document.getElementById('undoDelete').addEventListener('click', undoDeleteWatch);
  document.getElementById('diagToggle').addEventListener('click', () => { toggleSymbolMenu(false); toggleTickerWatchMenu(false); renderSearchResults([]); document.getElementById('marketDiag').classList.toggle('visible'); renderDiagnostics(); requestAnimationFrame(reportSize); });
  document.getElementById('copyDiag').addEventListener('click', async () => {
    const text = buildDiagnosticsText();
    try { await navigator.clipboard.writeText(text); showActionToast('诊断信息已复制', 'ok', 'diag-copy'); }
    catch (_) {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); showActionToast('诊断信息已复制', 'ok', 'diag-copy');
    }
  });

  watchlist = sanitizeSymbolList(safeLoadJSON(WATCHLIST_KEY, () => DEFAULT_WATCHLIST), WATCHLIST_MAX);
  recentSymbols = sanitizeSymbolList(safeLoadJSON(RECENT_KEY, []), 5).filter(r => !watchlist.some(w => w.symbol === r.symbol));
  saveRecent();
  const storedCurrent = normalizeSymbol(safeLoadJSON(CURRENT_SYMBOL_KEY, ''));
  if (storedCurrent) currentSymbol = storedCurrent;
  else if (watchlist.length) currentSymbol = watchlist[0].symbol;
  applyLowProfileMode(safeLoadJSON(LOW_PROFILE_KEY, false) === true);
  renderSymbolControls();
  window.__getCurrentSymbol = () => currentSymbol;
  setInterval(refreshFeedFreshness, 1000);

  const hud = document.getElementById('hud');
  const HUD_GAP = 4;

  // 纯函数：右侧够放就优先右侧；右侧不够时翻到左侧；两边都不够则选空间较大的一边。
  function chooseSettingsSide(petCenterScreenX, screenLeft, screenRight, neededWidth) {
    const rightSpace = screenRight - petCenterScreenX;
    const leftSpace = petCenterScreenX - screenLeft;
    if (rightSpace >= neededWidth) return 'right';
    if (leftSpace >= neededWidth) return 'left';
    return rightSpace >= leftSpace ? 'right' : 'left';
  }

  function positionTimeSimulator(windowLeftOverride) {
    if (!timeSimulator || !timeSimulator.classList.contains('visible')) return;
    const petRect = petbox.getBoundingClientRect();
    const panelWidth = timeSimulator.offsetWidth;
    const petHalfWidth = petRect.width / 2;
    const safeMargin = 16;
    const neededWidth = petHalfWidth + HUD_GAP + panelWidth + safeMargin;
    const screenLeft = Number.isFinite(screen.availLeft) ? screen.availLeft : 0;
    const screenRight = screenLeft + screen.availWidth;
    const windowLeft = Number.isFinite(windowLeftOverride) ? windowLeftOverride : window.screenX;
    const petCenterScreenX = windowLeft + window.innerWidth / 2;
    const side = chooseSettingsSide(petCenterScreenX, screenLeft, screenRight, neededWidth);

    timeSimulator.classList.toggle('side-left', side === 'left');
    timeSimulator.dataset.side = side;
    timeSimulator.style.setProperty('--time-offset', `${Math.ceil(petHalfWidth + HUD_GAP)}px`);
  }

  function toggleTimeSimulator(force) {
    if (!timeSimulator) return false;
    const show = typeof force === 'boolean' ? force : !timeSimulator.classList.contains('visible');
    timeSimulator.classList.toggle('visible', show);
    timeSimulator.setAttribute('aria-hidden', show ? 'false' : 'true');
    if (show) {
      // 调试面板和普通设置不同时展开，避免两块侧栏互相覆盖。
      if (hud && hud.classList.contains('visible')) hud.classList.remove('visible');
      const menu = document.getElementById('petMenu');
      if (menu) menu.classList.remove('visible');
      syncTimeSimulatorUI();
      positionTimeSimulator();
      requestAnimationFrame(() => {
        reportSize();
        requestAnimationFrame(() => positionTimeSimulator());
      });
    } else {
      requestAnimationFrame(reportSize);
    }
    return show;
  }
  window.__toggleTimeSimulator = toggleTimeSimulator;

  function positionSettingsPanel(windowLeftOverride) {
    if (!hud || !hud.classList.contains('visible')) return;
    const petRect = petbox.getBoundingClientRect();
    const panelWidth = hud.offsetWidth;
    const petHalfWidth = petRect.width / 2;
    const safeMargin = 16;
    const neededWidth = petHalfWidth + HUD_GAP + panelWidth + safeMargin;
    const screenLeft = Number.isFinite(screen.availLeft) ? screen.availLeft : 0;
    const screenRight = screenLeft + screen.availWidth;
    const windowLeft = Number.isFinite(windowLeftOverride) ? windowLeftOverride : window.screenX;
    const petCenterScreenX = windowLeft + window.innerWidth / 2;
    const side = chooseSettingsSide(petCenterScreenX, screenLeft, screenRight, neededWidth);

    hud.classList.toggle('side-left', side === 'left');
    hud.dataset.side = side;
    hud.style.setProperty('--hud-offset', `${Math.ceil(petHalfWidth + HUD_GAP)}px`);
  }

  // 第二层完整设置：只由快捷菜单的“更多设置”进入。
  function toggleSettings(force) {
    const show = typeof force === 'boolean' ? force : !hud.classList.contains('visible');
    if (show) toggleTickerWatchMenu(false);
    if (show && timeSimulator && timeSimulator.classList.contains('visible')) {
      timeSimulator.classList.remove('visible');
      timeSimulator.setAttribute('aria-hidden', 'true');
    }
    hud.classList.toggle('visible', show);
    if (show) {
      // 先决定左右侧，再按真实竖向面板尺寸扩窗。Electron resize 事件触发后会再次定位，避免只露半截。
      positionSettingsPanel();
      requestAnimationFrame(() => {
        reportSize();
        requestAnimationFrame(() => positionSettingsPanel());
      });
    } else {
      requestAnimationFrame(reportSize);
    }
  }

  // Electron 因 HUD 打开、缩放或贴屏幕边缘而改窗口尺寸后，重新判断左右侧。
  window.addEventListener('resize', () => {
    if (hud.classList.contains('visible')) positionSettingsPanel();
    if (timeSimulator && timeSimulator.classList.contains('visible')) positionTimeSimulator();
  });

  document.querySelectorAll('[data-time-preset]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      setTimePreset(btn.dataset.timePreset);
    });
  });
  if (realTimeBtn) realTimeBtn.addEventListener('click', e => {
    e.stopPropagation();
    useRealTime();
  });
  const timeSimulatorClose = document.getElementById('timeSimulatorClose');
  if (timeSimulatorClose) timeSimulatorClose.addEventListener('click', e => {
    e.stopPropagation();
    toggleTimeSimulator(false);
  });
  // 真实时间模式下让状态行保持走秒；模拟模式固定在所选预设时刻。
  setInterval(() => {
    if (timeSimulator && timeSimulator.classList.contains('visible') && !logicalNowOverride) syncTimeSimulatorUI();
  }, 1000);

  const petMenu = document.getElementById('petMenu');
  const scalePresets = document.getElementById('scalePresets');
  const scaleMinus = document.getElementById('scaleMinus');
  const scaleValue = document.getElementById('scaleValue');
  const scalePlus = document.getElementById('scalePlus');
  const moreSettings = document.getElementById('moreSettings');
  const closePetBtn = document.getElementById('closePet');
  const uiScaleRange = document.getElementById('uiScaleRange');

  function showPetMenu(x, y) {
    petMenu.classList.add('visible');
    scalePresets.classList.remove('visible');
    syncScaleControls();
    // 快捷菜单保持紧凑固定尺寸，不随牛放大一起膨胀；OS 缩放仍由 Chromium 自动处理。
    const menuW = petMenu.offsetWidth;
    const menuH = petMenu.offsetHeight;
    const left = Math.max(4, Math.min(x, window.innerWidth - menuW - 4));
    const top = Math.max(4, Math.min(y, window.innerHeight - menuH - 4));
    petMenu.style.left = `${left}px`;
    petMenu.style.top = `${top}px`;
  }
  function hidePetMenu() {
    petMenu.classList.remove('visible');
    scalePresets.classList.remove('visible');
  }
  function openQuickMenu(e) {
    e.preventDefault();
    if (e.stopPropagation) e.stopPropagation();
    showPetMenu(e.clientX, e.clientY);
  }
  petbox.addEventListener('contextmenu', openQuickMenu);

  scaleMinus.addEventListener('click', e => {
    e.stopPropagation();
    setUIScale(uiScalePercent - 10, { commit: true });
  });
  scalePlus.addEventListener('click', e => {
    e.stopPropagation();
    setUIScale(uiScalePercent + 10, { commit: true });
  });
  scaleValue.addEventListener('click', e => {
    e.stopPropagation();
    scalePresets.classList.toggle('visible');
  });
  scalePresets.addEventListener('click', e => {
    const btn = e.target.closest('[data-scale]');
    if (!btn) return;
    e.stopPropagation();
    setUIScale(Number(btn.dataset.scale), { commit: true });
    scalePresets.classList.remove('visible');
  });
  moreSettings.addEventListener('click', e => {
    e.stopPropagation();
    hidePetMenu();
    toggleSettings(true);
  });

  // 完整设置里的滑杆：拖动时只实时缩放 UI，松手/change 后 Electron 只调整一次窗口尺寸。
  uiScaleRange.addEventListener('input', e => {
    setUIScale(Number(e.target.value), { commit: false });
  });
  uiScaleRange.addEventListener('change', e => {
    setUIScale(Number(e.target.value), { commit: true });
  });

  // Ctrl + 滚轮：连续滚动合并成一次最终窗口 resize。
  window.addEventListener('wheel', e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    const delta = e.deltaY < 0 ? 10 : -10;
    setUIScale(uiScalePercent + delta, { commit: false });
    scheduleScaleCommit();
  }, { passive: false });

  // 左键拖牛身 = 移动窗口（牛身是 no-drag，无法用原生拖拽层，故改 JS 手动拖拽经 IPC 下发绝对坐标）
  let dragging = false, grabOffX = 0, grabOffY = 0, petBottomOffset = 0;
  petbox.addEventListener('mousedown', e => {
    if (e.button === 2) return; // 右键由 contextmenu → 快捷菜单处理
    if (e.button === 0) { // 左键 → 启动拖拽
      dragging = true;
      // 记录抓取点，以及牛本体底边相对窗口顶部的实际位置。
      // 主进程会用 petBottomOffset 对齐当前显示器 workArea 底边，因此最低点正好贴任务栏上沿。
      grabOffX = e.clientX; grabOffY = e.clientY;
      petBottomOffset = petbox.getBoundingClientRect().bottom;
      e.preventDefault();
    }
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    if (window.__inElectron && typeof require !== 'undefined') {
      // 新窗口坐标 = 鼠标屏幕坐标 − 抓取偏移，绝对定位与鼠标 1:1。
      // 同时把牛底偏移交给主进程，窗口本身可以有透明边距，但牛不会钻进任务栏。
      const nextWindowX = e.screenX - grabOffX;
      require('electron').ipcRenderer.send(
        'drag-window',
        nextWindowX,
        e.screenY - grabOffY,
        petBottomOffset
      );
      // 侧边面板已打开时实时重算左右侧，不再等到关掉重开或 resize 才识别空间。
      if (hud.classList.contains('visible')) positionSettingsPanel(nextWindowX);
      if (timeSimulator && timeSimulator.classList.contains('visible')) positionTimeSimulator(nextWindowX);
    }
  });
  window.addEventListener('mouseup', () => { dragging = false; });
  // 右键落在牛身之外（窗口空白/拖拽层）也打开同一套快捷菜单。
  window.addEventListener('contextmenu', e => {
    if (e.defaultPrevented) return; // 牛身已处理
    e.preventDefault();
    showPetMenu(e.clientX, e.clientY);
  });
  document.addEventListener('click', e => {
    if (!petMenu.contains(e.target)) hidePetMenu();
    if (!document.getElementById('ticker').contains(e.target)) toggleTickerWatchMenu(false);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleTickerWatchMenu(false); });
  closePetBtn.addEventListener('click', e => {
    e.stopPropagation();
    hidePetMenu();
    if (window.__inElectron && typeof require !== 'undefined') {
      require('electron').ipcRenderer.send('close-pet');
    } else {
      window.close(); // 浏览器模式：仅关闭自身窗口（脚本打开的才有效）
    }
  });
  // HUD 内「关闭面板」按钮：仅收起设置面板，不退出宠物
  const closePetInline = document.getElementById('closePetInline');
  if (closePetInline) closePetInline.addEventListener('click', e => {
    e.stopPropagation();
    toggleSettings(false);
  });

  // Electron injected flag from main.js
  if (typeof process !== 'undefined' && process.versions && process.versions.electron) {
    window.__inElectron = true;
  }

  // PER-10: 默认透明区域穿透；进入牛/HUD/菜单时恢复交互。
  function setMouseInteractive(value) {
    if (!window.__inElectron || typeof require === 'undefined') return;
    require('electron').ipcRenderer.send('set-mouse-interactive', value);
  }
  const mouseActiveZones = [petbox, document.getElementById('hud'), document.getElementById('petMenu'), document.getElementById('timeSimulator')].filter(Boolean);
  mouseActiveZones.forEach(zone => {
    zone.addEventListener('mouseenter', () => setMouseInteractive(true));
    zone.addEventListener('mouseleave', () => setMouseInteractive(false));
  });
  setMouseInteractive(false);

  setUIScale(130, { commit: false }); evaluatePhase();
  setInterval(evaluatePhase, 15000); // 每 15s 按本地时间重算时段相位，触发开/收盘窗口动画

})();
</script>
</body>
</html>
